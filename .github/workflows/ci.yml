# Intégration continue : à chaque push / pull request sur GitHub,
# compile le firmware (Pico 2 W) et lance les tests hôte (C + Python).
name: CI

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Outils de compilation ARM
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: SDK Pico 2.2.0
        run: git clone --depth 1 --branch 2.2.0 --recurse-submodules --shallow-submodules https://github.com/raspberrypi/pico-sdk.git "$HOME/pico-sdk"

      - name: Compilation du firmware
        run: |
          export PICO_SDK_PATH="$HOME/pico-sdk"
          cmake -S . -B build -G Ninja
          cmake --build build

      - name: Fichiers .uf2
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/*.uf2

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tests unitaires C (bus I2C simulé)
        run: |
          mkdir -p tests_hote
          for test in $(find tests -name 'test_*.c' | sort); do
            nom=$(basename "$test" .c)
            sources=$(grep -m1 '^// SOURCES:' "$test" | sed 's|^// SOURCES:||')
            echo "== $test"
            cc -std=c11 -Wall -Wextra -Werror -Isrc -Itests/mocks -o "tests_hote/$nom" "$test" $sources -lm
            "./tests_hote/$nom"
          done

      - name: Scripts Python
        run: |
          for script in outils/*.py; do python3 -m py_compile "$script"; done
          if find tests -name 'test_*.py' | grep -q .; then
            python3 -m unittest discover -s tests -p 'test_*.py' -t .
          fi
